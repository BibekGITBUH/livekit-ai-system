version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    ports:
      - "6379:6379"

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10050:10000-10050/udp"
    environment:
      SIP_CONFIG_BODY: |
        log_level: debug
        api_key: devkey
        api_secret: secretkeyphrase123456789012345632523532
        ws_url: ws://livekit-server:7880
        redis:
          address: redis:6379
        sip_port: 5060
        external_ip: 192.168.18.5
        rtp_port_range_start: 10000
        rtp_port_range_end: 10050
    depends_on:
      - livekit-server
      - redis

  livekit-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: livekit-agent
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretkeyphrase123456789012345632523532
      - GEMINI_API_KEY=AQ.Ab8RN6LsAIP7KQyL9LUg0IUR1aLZ-xf7DkuLmzcX5r6pUawlXw
    volumes:
      - ./agent/agent.py:/app/agent.py
    depends_on:
      - livekit-server
      - redis
